[workspace]
members = ["host", "cli", "protocol", "core", "gateway"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Unlicense"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
interprocess = "2.4.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
