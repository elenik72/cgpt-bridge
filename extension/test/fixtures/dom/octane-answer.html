<!-- "octane" markup (signed-out): the answer body is [data-assistant-markdown-root]; reasoning stays out. Synthetic, minimal. -->
<main>
  <div>
    <div data-message-role="user">Question</div>
    <div data-message-role="assistant">
      <div data-assistant-reasoning-summary="">Thought for a few seconds</div>
      <div data-assistant-markdown-root="">
        <p>Hello from octane.</p>
        <ol><li>first</li><li>second</li></ol>
        <pre><code class="language-python">print("hi")
</code></pre>
      </div>
      <div data-assistant-reasoning-transient="">Checking sources</div>
    </div>
  </div>
  <form>
    <textarea name="prompt"></textarea>
    <button data-composer-submit="" data-send-label="Send" data-stop-label="Stop"></button>
  </form>
</main>
